[package]
name = "sdroxide-server"
version.workspace = true
edition.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
crossbeam-channel.workspace = true
futures-util = "0.3.34"
mime_guess = "2.0.5"
opus = "0.4.0"
rtrb.workspace = true
# `deterministic-timestamps` records every embedded file's mtime and ctime as 0
# instead of whatever the checkout happened to leave on disk, which would
# otherwise make two builds of the same commit differ. Nothing reads them: the
# server keys its ETag on the content hash (`serve_embedded` in lib.rs).
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path", "deterministic-timestamps"], optional = true }
sdroxide-proto = { path = "../sdroxide-proto" }
# The space-weather feed behind /solar-ws (src/solar.rs), including its
# native-only network and cache half — which the server always is.
sdroxide-solar = { path = "../sdroxide-solar" }
sdroxide-types = { path = "../sdroxide-types" }
# The sign-in cookie's signature (`session_cookie`): HMAC-SHA256, whose hash is
# already in the tree through rustls, so this is a direct use of a crate the
# build has rather than a new dependency in the download. `subtle` is the
# constant-time comparison the MAC check needs — a byte-at-a-time one is a
# timing oracle on the thing that authenticates every connection.
sha2 = "0.11.0"
subtle = "2.6.1"
# The radio listing on /radios, which is the only JSON this server speaks —
# everything on the sockets is postcard.
serde = { workspace = true }
serde_json = "1.0.151"
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
# For the one layer that has to run *before* routing rather than after it: the
# reverse-proxy prefix strip (`strip_proxy_prefix`). `Router::layer` is applied
# to matched routes, so it is too late to change which route matches.
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.0", features = ["fs", "set-header"] }
tracing.workspace = true
triple_buffer = "9.0.0"
# The SondeHub relay (`sonde_online.rs`) asks it for the sonde list and a
# sonde's flight, on a client's request. Also a dev-dependency below.
ureq = "3.4.0"

[dev-dependencies]
# Only to POST to /signin in the end-to-end cookie test — the one thing here
# that speaks plain HTTP. Already in the tree at this version.
ureq = "3.4.0"
# The server only uses the engine, not SoapySDR device handling — leave
# `soapy` for the top-level binary to decide.
sdroxide-radio = { path = "../sdroxide-radio", default-features = false }
# Seeding and reading back the engine host's `radio.json` in `radio_config.rs`,
# through the same store the engine writes it with — a test that hand-rolled
# the file could pass against a format the engine cannot read.
sdroxide-config = { path = "../sdroxide-config" }
tokio-tungstenite = "0.30.0"
# `start_paused` clocks, so the sign-in gate's three-second lockout is asserted
# rather than waited out — the tests would otherwise take longer than the rest
# of the suite put together.
tokio = { version = "1.53.1", features = ["test-util"] }

[features]
embed-web = ["dep:rust-embed"]
