[package]
name = "sdroxide-digi"
version.workspace = true
edition.workspace = true
# GPL because it links mfsk-core (GPL-3.0-or-later). Isolated here so the
# permissive crates and the wasm client link no GPL code.
#
# The CW panel also links sdroxide-deepcw, which is AGPL-3.0-only. That is a
# stronger licence than this one and it reaches through: a build containing this
# crate carries AGPL §13, so anyone offered the program over a network has to be
# offered its source too.
license = "GPL-3.0-or-later"

[dependencies]
sdroxide-types.workspace = true
sdroxide-dsp.workspace = true
sdroxide-ax25.workspace = true
sdroxide-aprs.workspace = true
sdroxide-deepcw.workspace = true
sdroxide-rade.workspace = true
# The JS8 candidate loop hands complex baseband between mfsk-core primitives.
num-complex.workspace = true
# 0.10.2 pins the git-patched fork (see workspace [patch.crates-io]); caret
# would float whatever crates.io publishes against a locked source, and a git
# patch must match the requirement exactly to replace it.
mfsk-core = { version = "0.10.2", default-features = false, features = ["std", "ft8", "ft4", "wspr", "parallel", "fft-rustfft"] }
crossbeam-channel.workspace = true
# The WSPR candidate search is four-fifths Fano and splits cleanly across
# candidates. Already in the tree via mfsk-core's `parallel` feature.
rayon = "1"
tracing.workspace = true
# RIFP: the manifest is JSON, the object is verified with SHA-256, and its
# content-encodings are ZLIB, PNG/JPEG, and CCITT Group 4 facsimile in a TIFF
# wrapper. All pure Rust. `flate2` is shared with JS8, whose word dictionary
# ships deflated (src/js8/jsc_dict.bin) and is inflated once on first use.
serde.workspace = true
serde_json = "1"
sha2 = "0.11"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
fax = "0.3.0"
# Session IDs: the draft asks for a CSPRNG, which is all this is used for.
getrandom = "0.4.3"

[dev-dependencies]
# WAV in and out for the JS8 interop bridge and the decoder corpus tests.
hound = "3"
