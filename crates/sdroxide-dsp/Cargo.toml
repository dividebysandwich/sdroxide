[package]
name = "sdroxide-dsp"
version.workspace = true
edition.workspace = true

[dependencies]
sdroxide-types.workspace = true
rtrb.workspace = true
num-complex.workspace = true
rustfft.workspace = true
# Real-input FFT for the RX-888's wideband downconverter. A thin pure-Rust
# wrapper over rustfft (already in the tree via rubato), so it adds no new
# transitive dependency and stays wasm-clean.
realfft = "3.5"
rubato = "5.0.0"
# RNNoise neural speech denoiser (pure Rust, wasm-clean). Core library only —
# the default features pull in a CLI binary (clap/hound/dasp).
nnnoiseless = { version = "0.5.2", default-features = false }
# DeepFilterNet3 speech denoiser. Pure-Rust inference through tract — no ONNX
# Runtime, no C, nothing to install — with the model embedded in the binary.
#
# A git dependency because crates.io stops at 0.2.5, which is the DFN2 era: the
# `default-model` feature reaches outside the package directory with
# include_bytes! to pick up models/DeepFilterNet3_onnx.tar.gz, which is exactly
# what a published crate cannot do. Pinned by rev because cargo rejects a tag and
# a rev together; the rev is tag v0.5.6.
#
# The crate's library is named `df`, not `deep_filter`. Its default features
# would drag in vorbis and flac decoders for a CLI we do not build.
df = { package = "deep_filter", git = "https://github.com/Rikorose/DeepFilterNet", rev = "978576aa8400552a4ce9730838c635aa30db5e61", default-features = false, features = [
    "tract",
    "default-model",
] }
# For DfTract::process, which takes ndarray views. This MUST track deep_filter's
# own requirement (`ndarray = "^0.15"`) — a different major is a different crate,
# and the view types would not interoperate.
ndarray = "0.15"


[dev-dependencies]
# The off-air ACARS fixture test reads a WAV; the other crates that do this
# (DRM, digi, RADE) use the same crate.
hound = "3"
