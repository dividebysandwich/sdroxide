[package]
name = "sdroxide-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native network-cockpit clients for sdroxide: DX cluster telnet, POTA/SOTA/PSK Reporter spot feeds, QRZ/HamQTH callsign lookup, and LoTW/eQSL/Club Log/QRZ uploads."

[dependencies]
sdroxide-types.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json = "1"
flate2 = "1"
ureq = "3.4.0"
roxmltree = "0.21.1"
# Blocking WebSocket client for the FreeDV Reporter Socket.IO session
# (ws:// only — `handshake` for the client, no TLS).
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
ureq = "3.4.0"
