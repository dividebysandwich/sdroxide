[package]
name = "sdroxide-vara"
version.workspace = true
edition.workspace = true
description = "VARA HF modem: xara's station and host glue, sdroxide's host ports"
# MIT rather than the workspace GPL, deliberately: the station and TNC glue in
# here is ported from x0rro/xara (MIT), and keeping this crate under the same
# terms means upstream's licence survives on upstream's code. MIT is
# inbound-compatible with GPL, so the built binary is unaffected. See
# vendor/xara/PROVENANCE.md.
license = "MIT"

[dependencies]
xara-phy.workspace = true
xara-arq.workspace = true
xara-host.workspace = true
crossbeam-channel.workspace = true
