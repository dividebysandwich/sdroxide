name: Release

on:
  push:
    tags: ['v*']
  # Manual runs build all artifacts and upload them to the run page. Run one
  # against a `v*` ref (`gh workflow run release.yml --ref vX.Y.Z`, dispatched
  # the same way tag pushes would) to publish the platform builds and create
  # the GitHub Release too.
  workflow_dispatch:
    inputs:
      # Build only these platform labels, as a JSON list — e.g.
      # `["linux-aarch64"]`. Empty builds all of them, which is what a tag push
      # and the nightly do. Narrowing a run is how the aarch64 link probe is
      # afforded without paying for fourteen builds.
      wanted:
        description: 'Platform labels to build (JSON list; empty = all)'
        required: false
        default: ''
        type: string
      # Build only these package variants, as a JSON list — `["cat"]` or
      # `["soapy"]`, or both. Empty builds both, which is what every release and
      # every untargeted dispatch does. The nightly passes `["cat"]`: it is the
      # one a tester can run without installing PothosSDR first, so a nightly
      # that spent half its jobs on Soapy builds would be paying twice over for
      # the same evening.
      variants:
        description: 'Package variants to build (JSON list; empty = both)'
        required: false
        default: ''
        type: string
      # Instrument the aarch64 final link: a step-level deadline on the build, a
      # memory sampler running beside it, and the runner's own view of the
      # stalled process if it does stall. Inert unless asked for.
      diagnose:
        description: 'Instrument the aarch64 build (sampler, timings, diagnostics)'
        required: false
        default: false
        type: boolean
  # **No schedule here, and that is the point.** This workflow used to carry a
  # daily cron that built the whole matrix and then skipped creating a release
  # (the release is gated on a tag), so it published nothing and cost fourteen
  # builds a day.
  #
  # **A release happens only when somebody asks for one: a tag is pushed, or
  # this is dispatched by hand — and that is now true of the nightly as well.**
  # Its 18:00 cron was removed on 2026-10-18 at the operator's instruction
  # ("disable all auto releases"), after a nightly appeared overnight unasked
  # (and late: GitHub's scheduler started it at 20:21 UTC, not 18:00). The
  # arrangement that replaces it: **Kevin cuts the pre-releases**, and a full
  # release waits until everything is good and he says so.

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # audiopus_sys bundles a libopus whose CMakeLists predates CMake 3.5; the
  # CMake 4.x on the macOS/Windows runners refuses to configure it without
  # this override (CMake 3.x ignores the variable).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # Which build combinations this run wants. A tag or an untargeted manual run
  # builds all fourteen; the nightly names its own platforms and asks for the
  # `cat` variant, so it builds only what people actually downloaded, plus the
  # two it keeps whatever the counts say.
  #
  # The platform table lives in this job rather than in `build`'s own
  # `strategy.matrix` because a matrix written in YAML cannot be narrowed per
  # event. Shrinking the `label` list would leave the `include:` entries that
  # map a label to its runner with nothing to attach to, and GitHub turns an
  # unattached `include:` entry into an extra job rather than dropping it — so
  # the three platforms the nightly means to skip would come back as three
  # more builds.
  targets:
    name: pick targets
    runs-on: ubuntu-latest
    outputs:
      combos: ${{ steps.pick.outputs.combos }}
      stamp: ${{ steps.pick.outputs.stamp }}
      diagnose: ${{ inputs.diagnose }}
    steps:
      - id: pick
        run: |
          # Six of the eight release artifacts are published, not nine. Dropped
          # as of 1.9.20: `linux-aarch64`, `linux-x86_64-compat` and
          # `linux-aarch64-compat`.
          #
          # The measurement, across all eight published releases and 288
          # downloads: **21 of 31 assets have never been downloaded once**, and
          # every one of them is a Linux ARM or `-compat` artifact. The
          # `-soapysdr` tarballs, the `.wixpdb` and the macOS x86_64 tarballs
          # are in that 21 too, so "zero downloads" identifies the whole
          # long-tail packaging rather than three specific platforms — what
          # makes this worth acting on is that the *platforms* are what cost
          # the wall clock, and six of fifteen build jobs went to artifacts
          # nobody has ever fetched.
          #
          # Why those six are the ones to drop: every one of them runs Linux on
          # ARM or an older glibc, which is exactly the group the operator
          # reports building from source anyway — because a prebuilt binary from
          # a stranger's release is not what a cautious person installs on a
          # Pi. That is a deliberate choice about who these downloads are for,
          # not a claim that the artifacts were broken.
          #
          # `-compat` existed because the regular Linux build links glibc 2.39
          # and refuses to start on Ubuntu 22.04 / Mint 21 / Debian 12 / Pi OS
          # bookworm with "version `GLIBC_2.39' not found" (issue report
          # 2026-08). That reason is now carried by the build-from-source
          # section in the README, which works on any distribution, and it is
          # the reason those users build it anyway.
          #
          # What is **not** dropped: `linux-x86_64` (the `.deb`, the tarball and
          # the plain AppImage), Windows and both macOS builds, which is every
          # asset with a non-zero download count. Windows is the top asset in
          # every single release.
          #
          # The ARM and `-compat` entries are kept below under `extra_platforms`
          # rather than deleted: a manual dispatch may name them (see the
          # `wanted` input), so an ARM tester, or anyone who wants the artifact
          # for a specific occasion, can still ask for exactly those builds and
          # pay only for those. `nightly` also still builds `linux-aarch64-compat`.
          #
          # Every entry carries no `container` key except the `-compat` ones,
          # which `build` reads as the empty string and GitHub as "no container".
          platforms='[
            {"label": "linux-x86_64",         "os": "ubuntu-latest"},
            {"label": "windows-x86_64",       "os": "windows-latest"},
            {"label": "macos-aarch64",        "os": "macos-latest"},
            {"label": "macos-x86_64",         "os": "macos-15-intel"}
          ]'
          # Not in a release by default; reachable by naming them in a manual
          # dispatch's `wanted` list. See the note above.
          extra_platforms='[
            {"label": "linux-aarch64",        "os": "ubuntu-24.04-arm"},
            {"label": "linux-x86_64-compat",  "os": "ubuntu-latest",    "container": "ubuntu:22.04"},
            {"label": "linux-aarch64-compat", "os": "ubuntu-24.04-arm", "container": "ubuntu:22.04"}
          ]'
          # Every platform is built twice: `soapy` (dynamically links SoapySDR)
          # and `cat` (--no-default-features: no SoapySDR, runs without
          # libSoapySDR installed; drive a CAT rig over serial + a sound card
          # instead). The nightly builds `cat` only — it is what the installers
          # ship and the one a tester can run without installing PothosSDR
          # first — and it names its platforms and variants on the dispatch, so
          # there is no branch for it here.
          #
          # There used to be one, keyed on a scheduled event, because a cron run
          # could not pass inputs. The nightly has been manual-only since
          # 2026-10-18 (no release publishes by itself), and it passes both
          # inputs, so that branch was unreachable and is gone.
          if [[ -n "${{ inputs.wanted }}" ]]; then
            # A manual dispatch may narrow the run to named platforms, which is
            # how the aarch64 link probe runs without fourteen builds. The list
            # is validated here rather than trusted: a typo in a dispatch input
            # would otherwise produce an empty matrix and a green run that built
            # nothing at all.
            wanted='${{ inputs.wanted }}'
            variants='["soapy", "cat"]'
            jq -e 'type == "array" and length > 0' <<<"$wanted" > /dev/null \
              || { echo "::error::wanted must be a non-empty JSON list of platform labels"; exit 1; }
          else
            wanted='null'
            variants='["soapy", "cat"]'
          fi
          # A named variant list overrides whichever branch above chose, which is
          # how the nightly keeps the Soapy builds out without a second input
          # that had to agree with this one. Validated for the same reason
          # `wanted` is: a typo here would build nothing and still go green.
          if [[ -n "${{ inputs.variants }}" ]]; then
            variants='${{ inputs.variants }}'
            jq -e 'type == "array" and length > 0' <<<"$variants" > /dev/null \
              || { echo "::error::variants must be a non-empty JSON list"; exit 1; }
          fi
          # An include-only matrix: one job per entry, and no cross product to
          # filter down afterwards.
          #
          # The pool is `platforms + extra_platforms`, never `platforms` alone:
          # `extra_platforms` is how a manual dispatch still reaches the ARM and
          # `-compat` builds, and if it were left out of the pool then a
          # dispatch naming one of them would filter to nothing and produce the
          # empty matrix that `wanted` is validated above specifically to
          # prevent. Nothing in a release builds them unless they are named.
          # The pool depends on whether anything was *named*.
          #
          # `wanted == null` is the release path, and it means "no filter", so
          # the extras must not be in the pool there or a tag would quietly
          # build all fourteen again. When something *is* named — a manual
          # dispatch, or nightly — the pool is everything, because the name is
          # what chooses. Putting the extras in unconditionally is the one
          # version of this that looks right and reverts the whole change: it
          # yields 14 jobs on a release tag.
          if [[ "$wanted" == "null" ]]; then
            pool="$platforms"
          else
            pool=$(jq -cn --argjson platforms "$platforms" --argjson extra "$extra_platforms" '$platforms + $extra')
          fi
          combos=$(jq -cn \
            --argjson platforms "$pool" \
            --argjson wanted "$wanted" \
            --argjson variants "$variants" \
            '{include: [ $platforms[] as $p
                         | select($wanted == null or ($wanted | index($p.label)) != null)
                         | $variants[]
                         | $p + {variant: .} ]}')
          echo "combos=$combos" >> "$GITHUB_OUTPUT"
          echo "$combos" | jq .

          # What this build should call itself. A tag is a release and keeps the
          # bare crate version; anything else says which build it is and which
          # commit it came from, so `sdroxide --version`, the About box and a
          # crash report name the build rather than the release it was cut
          # from. `sdroxide-version`'s build script reads this; unset (a local
          # `cargo build`) means the plain version. Both the wasm client and
          # every native build take it from here so they agree.
          #
          # The `nightly` tag is asked about **first**, because it *is* a tag:
          # the generic branch below would otherwise catch it and leave a
          # nightly reporting the bare release version, which is the one thing
          # this stamp exists to prevent. It used to be keyed on a scheduled
          # event instead, and that was wrong in the same way twice over — the
          # nightly has been manual-only since 2026-10-18, and the runs that
          # produce it are dispatched against the tag.
          if [[ "$GITHUB_REF_NAME" == "nightly" ]]; then
            stamp="nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            stamp=""
          else
            stamp="dev.${GITHUB_SHA::7}"
          fi
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "build stamp: ${stamp:-<none, release>}"

  # Build the wasm web client once; every native build embeds the same dist.
  web:
    name: web client (wasm)
    needs: targets
    runs-on: ubuntu-latest
    # So the About box in a browser client agrees with the server that served
    # it, rather than naming the release the nightly was cut from.
    env:
      SDROXIDE_BUILD: ${{ needs.targets.outputs.stamp }}
    steps:
      # The client compiles none of the vendored code, but cargo reads every
      # workspace member's manifest before building any of them, and
      # sdroxide-hfdl reaches xng by path into the vendor/xng submodule.
      # Without it cargo stops at "failed to get `xng-mode-hfdl`", which is
      # what failed every nightly from 2026-09-24 on.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # The toolchain is pinned, not `@stable`. Rust 1.99.0 became stable on
      # 2026-10-01 and its aarch64 backend has a codegen pathology on
      # mfsk-core (the FT8/FT4 decoder): one rustc invocation pegs a single
      # core for hours with flat memory, no swap and a clean kernel log, so the
      # six aarch64 release jobs never finish and — because `create release`
      # needs every job — nothing ships at all. Measured on an
      # ubuntu-24.04-arm runner: 35 minutes and still going, versus the same
      # crate in seconds on x86_64. 1.98.1 is the last release that built the
      # ARM artifacts (v1.9.10, 2026-09-30). A release that reproduces the
      # compiler it was tested with is the right default anyway; bump this
      # deliberately, and re-run an aarch64 build when you do.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-dist
      - name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xzf - -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build web client
        working-directory: crates/sdroxide-web
        run: trunk build --release
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: crates/sdroxide-web/dist
          if-no-files-found: error
          # A nightly is superseded the next night, so it need not sit on the
          # run page for the repository's default 90 days. 0 means "use the
          # default", which is what a release tag or any other run keeps — the
          # `nightly` ref is the one that expires sooner.
          retention-days: ${{ github.ref_name == 'nightly' && 14 || 0 }}

  build:
    name: ${{ matrix.label }} (${{ matrix.variant }})
    needs: [web, targets]
    runs-on: ${{ matrix.os }}
    # A build that hangs must **fail**, not wait forever: the release is only
    # created once every job here is done, so one stuck job wedges the whole
    # release and `gh run rerun --failed` — which is the recovery, since only a
    # *failed* job is re-runnable — has nothing to act on. This was learned the
    # hard way on 2026-10-01: all six aarch64 jobs stalled silently at the
    # final binary link for over four hours across 1.9.11 and 1.9.12, with
    # nothing shipping and no way to see why.
    #
    # Generous, because the slow cases are real: the slowest job on a good run
    # is ~20 minutes (the ARM links), and a busy queue or a cold cache can
    # double that. 90 still fails four times faster than the wedge it replaces.
    timeout-minutes: 90
    # Empty for every non-compat entry, which means "no container".
    container: ${{ matrix.container }}
    env:
      SDROXIDE_BUILD: ${{ needs.targets.outputs.stamp }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.combos) }}
    defaults:
      run:
        shell: bash
    steps:
      # The -compat jobs start from a bare Ubuntu 22.04 image rather than the
      # runner image, so everything the runner normally provides is installed
      # here (as root — the image has no sudo). This must run BEFORE checkout:
      # without git in the container, actions/checkout silently falls back to
      # the REST API download, which cannot fetch the vendor/ submodules.
      # curl is for rustup, wget for the Opus model download that RADE's
      # autogen.sh does, zstd for the cache archives, and build-essential also
      # brings binutils (strip) and dpkg-dev (dpkg-shlibdeps, which cargo-deb
      # runs to compute the .deb's Depends).
      - name: Install build environment (compat container)
        if: matrix.container
        run: |
          apt-get update
          # build-essential also carries the C++ compiler the vendored DRM
          # receiver needs; nothing about DRM is a *system* dependency, because
          # Dream, faad2 and the FFT are all built from source in-tree.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl wget zstd build-essential \
            libasound2-dev pkg-config cmake autoconf automake libtool libclang-dev \
            file desktop-file-utils
          if [[ "${{ matrix.variant }}" == "soapy" ]]; then
            apt-get install -y --no-install-recommends libsoapysdr-dev
          fi

      # `submodules` pulls vendor/rade_c (the RADE codec), vendor/faad2 (the AAC
      # decoder the DRM receiver is built with), vendor/rtl_433 and vendor/xng
      # (the HFDL decode core). HD Radio's
      # decoder is not among them: it is the machine's own libnrsc5, loaded at
      # run time and never bundled (issue #488).
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_VERSION="$GITHUB_REF_NAME"
          else
            RELEASE_VERSION="dev-${GITHUB_SHA::7}"
          fi
          CARGO_VERSION=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          # The SoapySDR build gets a "-soapysdr" suffix; the non-SoapySDR build
          # (CAT/HPSDR/TCI, no libSoapySDR dependency) is the default, un-suffixed
          # artifact.
          if [[ "${{ matrix.variant }}" == "soapy" ]]; then SUFFIX="-soapysdr"; else SUFFIX=""; fi
          {
            echo "RELEASE_VERSION=$RELEASE_VERSION"
            echo "CARGO_VERSION=$CARGO_VERSION"
            echo "PKG=sdroxide-$RELEASE_VERSION-${{ matrix.label }}$SUFFIX"
          } >> "$GITHUB_ENV"

      - name: Install dependencies (Linux)
        # The -compat container jobs installed everything above, pre-checkout.
        if: runner.os == 'Linux' && !matrix.container
        run: |
          sudo apt-get update
          # ALSA + pkg-config are needed by both variants; SoapySDR only by `soapy`.
          # RADE builds a FARGAN-enabled Opus from source with autotools, and
          # bindgen needs libclang — which the DRM receiver's bindings need too.
          # DRM adds no system package of its own: Dream, faad2 and the FFT it
          # would otherwise take from fftw3 are all built from the vendored
          # sources, in both variants.
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config cmake autoconf automake libtool libclang-dev
          if [[ "${{ matrix.variant }}" == "soapy" ]]; then
            sudo apt-get install -y --no-install-recommends libsoapysdr-dev
          fi

      # Extract the PothosSDR bundle (no install needed); soapysdr-sys finds
      # SoapySDR.dll via PATH. Same approach as rust-soapysdr's own CI.
      # RADE's Opus dependency is built with autotools, which MSVC cannot drive
      # and whose static library MSVC cannot link. Windows therefore builds the
      # `x86_64-pc-windows-gnu` target inside MSYS2/MinGW — the same way
      # upstream FreeDV ships its Windows binaries. The DRM receiver is
      # compiled by `cc` directly rather than through its own build system, so
      # it never generates a makefile and cannot hit the MSYS `make` trap that
      # an absolute path in a rule line sets off.
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-clang
            autoconf
            automake
            libtool
      - name: Use the MSYS2 toolchain (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
          echo "D:/a/_temp/msys64/mingw64/bin" >> "$GITHUB_PATH"
          echo "D:/a/_temp/msys64/usr/bin" >> "$GITHUB_PATH"

      - name: Install SoapySDR (Windows)
        if: runner.os == 'Windows' && matrix.variant == 'soapy'
        run: |
          curl -L https://downloads.myriadrf.org/builds/PothosSDR/PothosSDR-2021.07.25-vc16-x64.exe -o pothossdr.exe
          7z x -opothos -y pothossdr.exe > /dev/null
          echo "${{ github.workspace }}/pothos/bin" >> "$GITHUB_PATH"

      # RADE builds a FARGAN-enabled Opus from source with autotools.
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake autoconf automake libtool

      - name: Install SoapySDR (macOS)
        if: runner.os == 'macOS' && matrix.variant == 'soapy'
        run: brew install pkg-config soapysdr

      # The toolchain is pinned, not `@stable`. Rust 1.99.0 became stable on
      # 2026-10-01 and its aarch64 backend has a codegen pathology on
      # mfsk-core (the FT8/FT4 decoder): one rustc invocation pegs a single
      # core for hours with flat memory, no swap and a clean kernel log, so the
      # six aarch64 release jobs never finish and — because `create release`
      # needs every job — nothing ships at all. Measured on an
      # ubuntu-24.04-arm runner: 35 minutes and still going, versus the same
      # crate in seconds on x86_64. 1.98.1 is the last release that built the
      # ARM artifacts (v1.9.10, 2026-09-30). A release that reproduces the
      # compiler it was tested with is the right default anyway; bump this
      # deliberately, and re-run an aarch64 build when you do.
      - uses: dtolnay/rust-toolchain@1.98.1
      # The Windows build cross-compiles under MSYS2/MinGW, so it needs the
      # *gnu* target, not the runner's host (msvc) one. This was never asked for
      # and never needed: `@stable` carried the target on the runner image, and
      # pinning the toolchain took it away — the build then failed at the first
      # crate with "can't find crate for `core`". Said out loud, it stops
      # depending on what a toolchain happens to ship.
      - name: Add the MinGW target (Windows)
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}-${{ matrix.variant }}

      # The embed-web feature bakes these files into the binary via rust-embed.
      - name: Fetch web client
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: crates/sdroxide-web/dist

      # The probe. A sampler runs beside the build so the memory curve survives
      # even when the job is killed: GitHub does not serve a running job's log,
      # so a stall is otherwise only visible as *silence*, which is the whole
      # reason three releases failed to tell a slow link from a stuck one.
      - name: Start the link sampler
        if: needs.targets.outputs.diagnose == 'true' && contains(matrix.label, 'linux-aarch64')
        run: |
          echo "sampling to $RUNNER_TEMP/link-sampler.log"
          (
            while true; do
              printf '%s ' "$(date -u +%H:%M:%S)"
              free -m | awk '/^Mem:/ {printf "mem_used=%-7s avail=%-7s ", $3, $7} /^Swap:/ {printf "swap_used=%-7s ", $3}'
              ps -eo rss=,comm= | awk '$2=="rustc"||$2=="cc1plus"||$2=="ld"||$2=="lld" {if ($1>m) m=$1} END {printf "linker_rss_mb=%-6d", m/1024}'
              ps -eo nlwp=,comm= | awk '$2=="rustc" {if ($1>n) n=$1} END {printf "rustc_threads=%-4d", n+0}'
              df -h --output=pcent,avail / | tail -1 | tr -s ' ' | cut -d' ' -f2-3 | sed 's/^/disk=/'
              echo
              sleep 20
            done
          ) >> "$RUNNER_TEMP/link-sampler.log" 2>&1 &
          echo "sampler pid $!"

      - name: Build
        # Under the probe the link gets a **step**-level deadline rather than
        # only the job's: a step timeout lets the job carry on into the
        # diagnostics below, where a job timeout would cancel them and take the
        # evidence with it.
        timeout-minutes: ${{ needs.targets.outputs.diagnose == 'true' && contains(matrix.label, 'linux-aarch64') && 40 || 90 }}
        run: |
          # `cat` drops the default `soapy` feature. `rtl433` is a default too,
          # but this build asks for it back: the embedded rtl_433 is statically
          # linked C, so it costs the SoapySDR-free artifact nothing at run time
          # and the release notes' "everything above" stays true. Both embed the
          # web client.
          #
          # `--timings` writes target/cargo-timings/, which says which crate the
          # build was in and for how long — the probe's own account of where the
          # time went. The ordinary build does not ask for it.
          timings=""
          if [[ "${{ needs.targets.outputs.diagnose }}" == "true" ]]; then timings="--timings"; fi
          if [[ "${{ matrix.variant }}" == "cat" ]]; then
            cargo build --release --locked $timings -p sdroxide --no-default-features --features embed-web,rtl433
          else
            cargo build --release --locked $timings -p sdroxide --features embed-web
          fi

      # What the stalled link was doing, from the runner's own side: how much
      # memory was left, how big the linker process had grown, what the kernel
      # has to say (the OOM killer writes here, and would explain a long silent
      # grind better than anything else), and where cargo thought it was.
      - name: Diagnose the link
        if: always() && needs.targets.outputs.diagnose == 'true' && contains(matrix.label, 'linux-aarch64')
        run: |
          set +e
          echo "== the machine =="
          nproc; uname -a; free -m; df -h / /github/workspace 2>/dev/null
          echo "== memory curve (every 20s) =="
          tail -60 "$RUNNER_TEMP/link-sampler.log"
          echo "== processes by rss =="
          ps -eo pid,ppid,etimes,rss,vsz,stat,pcpu,comm --sort=-rss | head -15
          echo "== the compiler itself =="
          for p in $(pgrep -x rustc) $(pgrep -x cc1plus); do
            echo "--- pid $p ---"
            grep -E '^(Name|State|VmPeak|VmSize|VmRSS|VmSwap|Threads)' "/proc/$p/status"
            echo "wchan: $(cat "/proc/$p/wchan" 2>/dev/null)"
            echo "io: $(tr '\n' ' ' < "/proc/$p/io" 2>/dev/null | cut -c1-200)"
            tr '\0' ' ' < "/proc/$p/cmdline" | cut -c1-160; echo
          done
          echo "== kernel ring buffer (the OOM killer writes here) =="
          sudo dmesg -T 2>/dev/null | tail -40 || dmesg -T 2>/dev/null | tail -40
          echo "== cargo's own timings =="
          ls -la target/cargo-timings/ 2>/dev/null
          echo "== what the link got as far as =="
          ls -la target/release/deps/ 2>/dev/null | grep -E 'sdroxide|deepcw' | tail -8

      - name: Upload the link probe
        if: always() && needs.targets.outputs.diagnose == 'true' && contains(matrix.label, 'linux-aarch64')
        uses: actions/upload-artifact@v7
        with:
          name: link-probe-${{ matrix.label }}-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/link-sampler.log
            target/cargo-timings/
          if-no-files-found: warn

      # MinGW links libstdc++/libgcc/libwinpthread as DLLs by default, and
      # those exist only on a machine with MSYS2 or PothosSDR installed — a
      # plain Windows box answers "libstdc++-6.dll not found" the moment the
      # user double-clicks the .exe. .cargo/config.toml and
      # crates/sdroxide-drm/build.rs link them in statically instead; this
      # checks that actually held, because the failure is otherwise invisible
      # here and only shows up on a user's machine.
      - name: Check for MinGW runtime DLLs (Windows)
        if: runner.os == 'Windows'
        run: |
          BIN="target/$CARGO_BUILD_TARGET/release/sdroxide.exe"
          objdump -p "$BIN" | grep -i "DLL Name:" | sort -u
          if objdump -p "$BIN" \
               | grep -Eiq "DLL Name:[[:space:]]*(libstdc\+\+|libgcc_s|libwinpthread)"; then
            echo "::error::sdroxide.exe still needs a MinGW runtime DLL beside it"
            exit 1
          fi

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          strip target/release/sdroxide
          mkdir -p out stage/sdroxide
          cp target/release/sdroxide LICENSE stage/sdroxide/
          # Every binary embeds the RX-888's FX3 firmware image, which is MIT
          # licensed: the notice has to travel with the binary, not just live
          # in the source tree.
          cp crates/sdroxide-rx888/firmware/LICENSE.txt stage/sdroxide/LICENSE-rx888-firmware.txt
          # ...and CMUdict, embedded for the spoken announcements'
          # grapheme-to-phoneme. BSD-2-Clause, same argument.
          cp crates/sdroxide-speech/assets/LICENSE-cmudict.txt stage/sdroxide/
          # ...and the DeepCW model, embedded for the CW decoder. This one is
          # AGPL-3.0-only, which is stronger than sdroxide's own GPL and adds a
          # network clause, so the notice matters more here than for the two
          # above rather than less.
          cp crates/sdroxide-deepcw/LICENSE stage/sdroxide/LICENSE-deepcw.txt
          # The speech voice. Unlike the two above this is not embedded — it is
          # CC BY-NC-SA, which a GPL binary may not absorb, so it travels as a
          # data file the program reads at run time. sdroxide looks for a
          # "voices" directory beside the executable, which is what this is.
          # The .deb gets the same files through cargo-deb's asset list.
          mkdir -p stage/sdroxide/voices
          cp assets/voices/en_US-hfc_female-medium.onnx \
             assets/voices/en_US-hfc_female-medium.onnx.json \
             assets/voices/en_US-hfc_female-medium.MODEL_CARD stage/sdroxide/voices/
          cp assets/voices/LICENSE-voice.txt stage/sdroxide/
          # The .deb registers the menu entry itself; the portable tarball
          # carries the same files plus a script that installs them per-user.
          cp packaging/linux/sdroxide.desktop packaging/icons/sdroxide-brown.svg stage/sdroxide/
          cp packaging/linux/install-desktop-entry.sh stage/sdroxide/
          # Likewise the udev rules: the .deb drops them in
          # /usr/lib/udev/rules.d, but a tarball user has to install them by
          # hand and cannot do that if they are not in the tarball. Both
          # variants carry them — the RTL-SDR, RX-888 and Airspy HF+ drivers
          # are native and present in every build.
          cp packaging/linux/60-sdroxide-rtlsdr.rules packaging/linux/60-sdroxide-rx888.rules \
             packaging/linux/60-sdroxide-airspyhf.rules packaging/linux/60-sdroxide-hackrf.rules \
             packaging/linux/60-sdroxide-airspy.rules packaging/linux/60-sdroxide-elad.rules \
             packaging/linux/60-sdroxide-limerfe.rules stage/sdroxide/
          if [[ "${{ matrix.variant }}" == "cat" ]]; then
            cat > stage/sdroxide/README.txt <<'EOF'
          sdroxide — SDR transceiver (https://github.com/dividebysandwich/sdroxide)

          Standard build (no SoapySDR). Runtime requirement:
            libasound2 (or libasound2t64)   — ALSA

          Drives, with no SoapySDR involved at all:
            * RTL-SDR dongles, RX-888 / RX-888 Mk2 receivers and Airspy HF+
              (Dual / Discovery / Ranger), directly over USB via native
              pure-Rust drivers. The RX-888's FX3 firmware is bundled and
              uploaded automatically, so there is no vendor driver package to
              install and nothing to run first.
            * a CAT-controlled radio over a serial port + sound card
              (Settings -> Audio/CAT)
            * the OpenHPSDR and TCI network backends

          Other SoapySDR devices (HackRF, Airspy R2/Mini, PlutoSDR, ...) need
          the "-soapysdr" build.

          Run ./sdroxide for the GUI, ./sdroxide --server to serve the web UI
          on http://localhost:4950, or ./sdroxide --help for all options.
          EOF
          else
            cat > stage/sdroxide/README.txt <<'EOF'
          sdroxide — SDR transceiver (https://github.com/dividebysandwich/sdroxide)

          Runtime requirements (Debian/Ubuntu package names):
            libsoapysdr0.8  soapysdr-module-all  libasound2 (or libasound2t64)

          RTL-SDR dongles, RX-888 / RX-888 Mk2 receivers and the Airspy HF+
          do not go through SoapySDR in this build either: they have native
          pure-Rust drivers and are opened directly over USB. SoapySDR is what
          adds everything else (HackRF, Airspy R2/Mini, PlutoSDR, ...).

          Run ./sdroxide for the GUI, ./sdroxide --server to serve the web UI
          on http://localhost:4950, or ./sdroxide --help for all options.
          EOF
          fi
          cat >> stage/sdroxide/README.txt <<'EOF'

          HD Radio (the digital sidecar of North American FM stations) needs
          nrsc5's decoder library, libnrsc5.so, which is not bundled: sdroxide
          loads it at startup when it is there. Install nrsc5 from
          https://github.com/theori-io/nrsc5 (on Arch, the nrsc5-git AUR
          package), or put libnrsc5.so beside the sdroxide executable. Without
          it the HD RADIO mode is shown greyed out, and hovering it says why.

          To add sdroxide to your desktop menu, run ./install-desktop-entry.sh
          (per-user, no root needed; --uninstall removes it again). The .deb
          package registers the menu entry automatically.

          USB receivers: opening an RTL-SDR, RX-888 or Airspy HF+ as a normal
          user needs a udev rule, which the .deb installs for you but the
          tarball cannot:

            sudo cp 60-sdroxide-*.rules /usr/lib/udev/rules.d/
            sudo udevadm control --reload

          Then unplug and replug the receiver. Without this sdroxide will see
          the device and fail to open it (--probe says which).

          LICENSE-rx888-firmware.txt covers the RX-888 FX3 firmware image that
          is bundled in the binary and uploaded to the receiver; it is MIT
          licensed and separate from sdroxide's own LICENSE.

          Spoken announcements: the radio can read itself out — frequency,
          mode, band, SWR while you tune up, FT8/JS8 messages addressed to you
          — so it can be operated without seeing it. Switch it on under
          Settings -> General -> Voice announcements. The voice runs on this
          machine; nothing is sent anywhere.

          The voice lives in the "voices" directory beside the program. It is
          CC BY-NC-SA 4.0 (see LICENSE-voice.txt) rather than GPL, which is
          why it is a separate data file and not part of the program itself.
          LICENSE-cmudict.txt covers the pronunciation dictionary embedded in
          the binary (BSD-2-Clause).

          CW decoding uses the DeepCW neural model, which is embedded in the
          binary and is AGPL-3.0-only (see LICENSE-deepcw.txt) — a stronger
          copyleft than sdroxide's own GPL. Because it is linked in rather than
          read as a data file, that licence covers this binary as a whole, and
          its section 13 applies: if you run sdroxide as a server and let other
          people use it over a network, you have to offer them the source.
          EOF
          tar czf "out/$PKG.tar.gz" -C stage sdroxide
          cargo install cargo-deb --locked
          # The SoapySDR build uses the `soapysdr` deb variant (package
          # sdroxide-soapysdr, recommends the driver modules); the default build
          # uses the base metadata (package sdroxide, no SoapySDR recommendation).
          if [[ "${{ matrix.variant }}" == "soapy" ]]; then
            cargo deb --no-build -p sdroxide --variant soapysdr -o "out/$PKG.deb"
          else
            cargo deb --no-build -p sdroxide -o "out/$PKG.deb"
          fi

      - name: Package AppImage (Linux)
        # Issue #208: one file to download and run, with no install step and no
        # package manager.
        #
        # Built from the **-compat** job and from the standard variant only,
        # and both halves of that are deliberate:
        #
        # * -compat, because an AppImage is a promise that the file runs on the
        #   machine it lands on, and that promise is glibc's to keep. The
        #   regular Linux build needs glibc 2.39; this one links 2.35 and so
        #   covers the stable distributions as well as the current ones.
        # * standard (no SoapySDR), because a SoapySDR AppImage would have to
        #   carry libSoapySDR *and* the driver modules it goes looking for at
        #   run time, in a directory laid out the way that library expects. That
        #   is the half-working bundle AppImages are notorious for, and this
        #   build needs none of it: the native drivers — RTL-SDR, RX-888,
        #   HackRF, Airspy, AirspyHF+, SDRplay, LimeSDR, PlutoSDR, HPSDR, TCI,
        #   CAT — are all compiled in.
        #
        # Nothing is bundled beside the binary. ALSA, X11, Wayland, GLIBC and
        # the GL stack are on AppImage's own exclude list precisely because they
        # have to be the host's — a bundled libasound cannot see the host's
        # sound configuration, and a bundled GL stack cannot see its driver. So
        # this AppImage is exactly as portable as the -compat tarball beside it,
        # and is a single runnable file with a menu entry instead of a directory
        # to unpack.
        if: runner.os == 'Linux' && matrix.variant == 'cat' && contains(matrix.label, 'compat')
        run: |
          case "${{ matrix.label }}" in
            *aarch64*) export ARCH=aarch64 ;;
            *)         export ARCH=x86_64 ;;
          esac
          # The AppDir. `voices/` sits beside the executable because that is
          # where the program looks for it (`speech::synth::voice_dirs` reads
          # `current_exe()`), which inside a mounted AppImage is
          # /tmp/.mount_XXXX/usr/bin.
          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/scalable/apps \
                   AppDir/usr/share/doc/sdroxide
          cp target/release/sdroxide AppDir/usr/bin/
          cp -r stage/sdroxide/voices AppDir/usr/bin/
          cp stage/sdroxide/*.txt stage/sdroxide/LICENSE stage/sdroxide/*.rules \
             AppDir/usr/share/doc/sdroxide/
          cp packaging/linux/sdroxide.desktop AppDir/usr/share/applications/
          cp packaging/icons/sdroxide-brown.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          # appimagetool wants the desktop entry and the icon at the AppDir root
          # as well, and `.DirIcon` is what a file manager shows.
          cp packaging/linux/sdroxide.desktop AppDir/
          cp packaging/icons/sdroxide-brown.svg AppDir/
          cp packaging/icons/sdroxide-brown.svg AppDir/.DirIcon
          # AppRun rather than a symlink to the binary: `exec` keeps the process
          # id, so a desktop that started the AppImage still owns the window,
          # and "$@" passes the command line through — `--server`, `--probe` and
          # the rest work exactly as they do on the tarball.
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/sdroxide" "$@"
          EOF
          chmod +x AppDir/AppRun
          # `--appimage-extract-and-run`: appimagetool is itself an AppImage and
          # mounting one needs FUSE, which a container has no business having.
          TOOL_URL=https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$ARCH.AppImage
          curl -sSfL "$TOOL_URL" -o appimagetool
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "out/$PKG.AppImage"
          # A file that cannot be run is not what this feature promised, so
          # prove it can — on x86_64, where the runner is the target. The
          # AppImage runtime needs FUSE and the runner has none, so this is the
          # extract-and-run path, which is also the escape hatch a user without
          # FUSE has.
          if [[ "$ARCH" == "x86_64" ]]; then
            APPIMAGE_EXTRACT_AND_RUN=1 "out/$PKG.AppImage" --version
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p out stage/sdroxide
          # CARGO_BUILD_TARGET (the MSYS2/MinGW toolchain, set above) makes
          # cargo write to a target-specific directory rather than
          # target/release.
          BIN_DIR="target/$CARGO_BUILD_TARGET/release"
          cp "$BIN_DIR/sdroxide.exe" stage/sdroxide/
          cp LICENSE stage/sdroxide/LICENSE.txt
          # MIT notice for the FX3 firmware image embedded in the binary.
          cp crates/sdroxide-rx888/firmware/LICENSE.txt stage/sdroxide/LICENSE-rx888-firmware.txt
          cp crates/sdroxide-speech/assets/LICENSE-cmudict.txt stage/sdroxide/
          # AGPL notice for the DeepCW model embedded in the binary.
          cp crates/sdroxide-deepcw/LICENSE stage/sdroxide/LICENSE-deepcw.txt
          # The speech voice, in a "voices" directory beside the executable —
          # see the Linux step for why it is a data file rather than embedded.
          mkdir -p stage/sdroxide/voices
          cp assets/voices/en_US-hfc_female-medium.onnx \
             assets/voices/en_US-hfc_female-medium.onnx.json \
             assets/voices/en_US-hfc_female-medium.MODEL_CARD stage/sdroxide/voices/
          cp assets/voices/LICENSE-voice.txt stage/sdroxide/
          if [[ "${{ matrix.variant }}" == "cat" ]]; then
            cat > stage/sdroxide/README.txt <<'EOF'
          sdroxide — SDR transceiver (https://github.com/dividebysandwich/sdroxide)

          Standard build (no SoapySDR / PothosSDR needed). Drives:
            * RTL-SDR dongles, RX-888 / RX-888 Mk2 receivers and Airspy HF+
              (Dual / Discovery / Ranger), directly over USB via native
              drivers. The RX-888's FX3 firmware is bundled and uploaded
              automatically — no vendor driver package needed. The HF+ needs
              WinUSB, which Zadig or Airspy's own package installs.
            * a CAT-controlled radio over a serial port + sound card
              (Settings -> Audio/CAT)
            * the OpenHPSDR and TCI network backends

          Other SoapySDR devices (HackRF, Airspy R2/Mini, PlutoSDR, ...) need
          the "-soapysdr" build.

          Run sdroxide.exe for the GUI, sdroxide.exe --server to serve the web
          UI on http://localhost:4950, or sdroxide.exe --help for all options.
          EOF
          else
            cat > stage/sdroxide/README.txt <<'EOF'
          sdroxide — SDR transceiver (https://github.com/dividebysandwich/sdroxide)

          Requires PothosSDR (provides SoapySDR and the device drivers):
            https://downloads.myriadrf.org/builds/PothosSDR/
          During its installation choose "Add PothosSDR to the system PATH".

          RTL-SDR dongles and RX-888 / RX-888 Mk2 receivers do not go through
          SoapySDR in this build either: they have native drivers and are
          opened directly over USB.

          Run sdroxide.exe for the GUI, sdroxide.exe --server to serve the web
          UI on http://localhost:4950, or sdroxide.exe --help for all options.
          EOF
          fi
          # Both variants have the native USB drivers, so both need the WinUSB
          # note. Zadig is the only Windows-side setup either receiver needs.
          cat >> stage/sdroxide/README.txt <<'EOF'

          HD Radio (the digital sidecar of North American FM stations) needs
          nrsc5's decoder library, libnrsc5.dll, which is not bundled: put it,
          and the DLLs it depends on, beside sdroxide.exe. nrsc5 publishes no
          Windows download; it builds with MSYS2 (see
          https://github.com/theori-io/nrsc5). Without it the HD RADIO mode is
          shown greyed out, and hovering it says why.

          USB receivers: Windows has no driver bound to an RTL-SDR or RX-888
          out of the box. Use Zadig (https://zadig.akeo.ie/) to bind the device
          to WinUSB — for the RX-888 do this for BOTH of its USB ids,
          04B4:00F3 (the bare Cypress FX3 bootloader it enumerates as on every
          plug-in) and 04B4:00F1 (the same device once sdroxide has uploaded
          firmware into it). Binding only the second one never works, because
          the upload happens through the first.

          LICENSE-rx888-firmware.txt covers the RX-888 FX3 firmware image that
          is bundled in the binary and uploaded to the receiver; it is MIT
          licensed and separate from sdroxide's own LICENSE.txt.

          Spoken announcements: the radio can read itself out — frequency,
          mode, band, SWR while you tune up, FT8/JS8 messages addressed to you
          — so it can be operated without seeing it. Switch it on under
          Settings -> General -> Voice announcements. The voice runs on this
          machine; nothing is sent anywhere.

          The voice lives in the "voices" directory beside the program. It is
          CC BY-NC-SA 4.0 (see LICENSE-voice.txt) rather than GPL, which is
          why it is a separate data file and not part of the program itself.
          LICENSE-cmudict.txt covers the pronunciation dictionary embedded in
          the binary (BSD-2-Clause).

          CW decoding uses the DeepCW neural model, which is embedded in the
          binary and is AGPL-3.0-only (see LICENSE-deepcw.txt) — a stronger
          copyleft than sdroxide's own GPL. Because it is linked in rather than
          read as a data file, that licence covers this binary as a whole, and
          its section 13 applies: if you run sdroxide as a server and let other
          people use it over a network, you have to offer them the source.
          EOF
          7z a "out/$PKG.zip" ./stage/sdroxide > /dev/null
          # The MSI (fixed product identity) is only built for the default
          # (non-SoapySDR) variant; SoapySDR users take the portable .zip.
          if [[ "${{ matrix.variant }}" == "cat" ]]; then
            dotnet tool install --global wix --version 5.0.2
            wix build packaging/windows/main.wxs -arch x64 \
              -d Version="$CARGO_VERSION" -d BinDir="$BIN_DIR" \
              -o "out/$PKG.msi"
            # Stable-named copies of the default build, so a page can link
            # "the Windows build" once instead of carrying a version in the
            # URL that has to be edited on every release. Only the default
            # variant publishes them, so they never collide with the SoapySDR
            # .zip and always mean the recommended build. The versioned files
            # beside them remain the canonical, archiveable names.
            cp "out/$PKG.msi" out/sdroxide-windows-x86_64.msi
            cp "out/$PKG.zip" out/sdroxide-windows-x86_64.zip
          fi

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
