          fi
          cat >> stage/sdroxide/README.txt <<'EOF'

          HD Radio (the digital sidecar of North American FM stations) needs
          nrsc5's decoder library, libnrsc5.dylib, which is not bundled: build
          and install nrsc5 from https://github.com/theori-io/nrsc5, which puts
          it in /usr/local/lib, where sdroxide looks. Without it the HD RADIO
