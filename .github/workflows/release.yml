            cp target/release/sdroxide "$APP/Contents/MacOS/sdroxide"
            # CFBundleIconFile=sdroxide resolves to this; without it Launchpad
            # and the Dock fall back to the blank generic-application icon.
            cp packaging/macos/sdroxide-brown.icns "$APP/Contents/Resources/sdroxide-brown.icns"
            # The MIT notice for the embedded FX3 firmware goes into the bundle
            # (so it survives dragging the .app out of the image) as well as
            # alongside it. It has to be in place before codesign, which seals
            # the contents of Resources into the signature.
            cp crates/sdroxide-rx888/firmware/LICENSE.txt "$APP/Contents/Resources/LICENSE-rx888-firmware.txt"
            cp crates/sdroxide-speech/assets/LICENSE-cmudict.txt "$APP/Contents/Resources/"
            cp crates/sdroxide-deepcw/LICENSE "$APP/Contents/Resources/LICENSE-deepcw.txt"
            # The speech voice. In a bundle it goes under Resources, which is
            # where sdroxide looks once it finds itself in Contents/MacOS.
            # Also before codesign, for the same reason as the notices above.
            mkdir -p "$APP/Contents/Resources/voices"
            cp assets/voices/en_US-hfc_female-medium.onnx \
               assets/voices/en_US-hfc_female-medium.onnx.json \
               assets/voices/en_US-hfc_female-medium.MODEL_CARD "$APP/Contents/Resources/voices/"
            cp assets/voices/LICENSE-voice.txt "$APP/Contents/Resources/"
            codesign --force -s - "$APP/Contents/MacOS/sdroxide"
            codesign --force -s - "$APP"
            cp LICENSE stage-dmg/
            cp crates/sdroxide-rx888/firmware/LICENSE.txt stage-dmg/LICENSE-rx888-firmware.txt
            cp assets/voices/LICENSE-voice.txt crates/sdroxide-speech/assets/LICENSE-cmudict.txt stage-dmg/
            cp crates/sdroxide-deepcw/LICENSE stage-dmg/LICENSE-deepcw.txt
            # The image is created at an explicit size and filled by hand
            # rather than handed to `hdiutil create -srcfolder`, whose own
            # sizing runs out of room mid-copy ("hdiutil: create failed - No
            # space left on device") with ~160 GB still free on the host: the
            # image, not the disk, is what fills up. The /Applications
            # shortcut is the one thing in that folder whose size is open to
            # interpretation, so it is made inside the mounted image instead,
            # where it cannot enter the size calculation at all.
            size_mb=$(( $(du -sm stage-dmg | cut -f1) + 64 ))
            # No -format here: it is only accepted together with -srcfolder or
            # -srcdevice, and a blank sized image is read-write UDIF anyway.
            hdiutil create -volname sdroxide -fs HFS+ -size "${size_mb}m" \
              -ov rw.dmg
            mnt=$(mktemp -d)
            hdiutil attach rw.dmg -mountpoint "$mnt" -nobrowse -noautoopen
            # ditto, not cp: the code signature lives in extended attributes.
            ditto "$APP" "$mnt/sdroxide.app"
            codesign --verify --strict "$mnt/sdroxide.app"
            cp LICENSE "$mnt/"
            cp crates/sdroxide-rx888/firmware/LICENSE.txt "$mnt/LICENSE-rx888-firmware.txt"
            cp assets/voices/LICENSE-voice.txt crates/sdroxide-speech/assets/LICENSE-cmudict.txt "$mnt/"
            cp crates/sdroxide-deepcw/LICENSE "$mnt/LICENSE-deepcw.txt"
            ln -s /Applications "$mnt/Applications"
            hdiutil detach "$mnt" || { sleep 5; hdiutil detach "$mnt" -force; }
            hdiutil convert rw.dmg -format UDZO -ov -o "out/$PKG.dmg"
            rm -f rw.dmg
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.label }}-${{ matrix.variant }}
          path: out/*
          if-no-files-found: error
          # As above: a nightly's artifacts expire in a fortnight, a tagged
          # build's become the release assets and keep the default retention.
          retention-days: ${{ github.ref_name == 'nightly' && 14 || 0 }}

  # Arch Linux. No package is shipped in the release any more: Arch users
  # build sdroxide themselves from the PKGBUILD in packaging/arch/, which
  # clones the repo at `#tag=v$pkgver` and pulls the vendor/ submodules on its
  # own, so it always matches the release it advertises.
  release:
    name: create release
    needs: [web, build]
    # **Run even if a build job failed**, so the platforms that did build are
    # still published. A flaky macOS-ARM runner has stopped this job three or
    # four times with every other platform sitting finished and uploaded
    # nowhere. `!cancelled()` rather than `always()`: a run somebody cancelled
    # by hand should not publish a partial release. The missing platform is
    # still visible — the run ends red and the release is missing that asset.
    if: ${{ !cancelled() && (github.ref_type == 'tag' || startsWith(github.ref_name, 'v')) }}
    runs-on: ubuntu-latest
    steps:
      # The curated release notes are read out of `CHANGELOG.md` **at the tag**,
      # and this job had no checkout at all: it only downloaded artifacts, so
      # the awk that reads the changelog died with "cannot open file" and the
      # release was never created — after all fourteen build jobs had succeeded
      # and their assets were sitting on the run page. Latent since the notes
      # were switched to the changelog, which was after v1.9.11; 1.9.11 and
      # 1.9.12 never reached this job at all.
      #
      # No submodules: the changelog is the only thing read out of the tree, and
      # the artifacts carry the program.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        # Tolerant, so a failed wasm build does not take the whole release with
        # it — the binary assets are the point, and the web client is one extra
        # file. The zip step below is skipped when the artifact is absent.
        continue-on-error: true
        with:
          name: web-dist
          path: web-dist
      - name: Zip standalone web client
        if: ${{ hashFiles('web-dist/**') != '' }}
        run: |
          cd web-dist
          zip -r "../dist/sdroxide-web-$GITHUB_REF_NAME.zip" .
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > brown.md <<'EOF'
          ## SDR Oxide Brown

          The CB and shortwave-listener build of sdroxide — upstream's program with
          **11 m / CB** and **SWL** added on top. It installs beside the upstream build
          and keeps its own settings. See the [README](https://github.com/madmedicnl/sdroxide-brown#readme).
          EOF
          cat > notes.md <<'EOF'
          ### Which build to download

          **Standard** needs no SoapySDR and drives RTL-SDR, RX-888 and Airspy HF+
          directly — take it unless your device needs SoapySDR (**`-soapysdr`**: HackRF,
          Airspy R2/Mini, PlutoSDR). Installers are Standard only, and every build embeds
          the browser client: `sdroxide --server`, then open `http://<host>:4950`.
          EOF
          # The `nightly` tag is moved to the branch head by the Nightly
          # workflow and dispatched here. Publish it as a **pre-release**, so
          # `/releases/latest` — and the README's stable download links — keep
          # pointing at a tagged release rather than at last night's build.
          # This fork's own releases carry a `_brown` tag (v1.9.2_brown); the
          # title names the variant the same way the program does, so a
          # screenshot and a release page agree. A nightly is still a nightly.
          title="SDR Oxide Brown $GITHUB_REF_NAME"
          extra=()
          nightly=0
          if [ "$GITHUB_REF_NAME" = "nightly" ]; then
            # A nightly is a nightly: the "what this build adds" overview is for
            # a tagged release, so only the untested-build warning goes on top.
            nightly=1
            title="SDR Oxide Brown nightly $(date -u +%Y-%m-%d)"
            extra+=(--prerelease)
            {
              printf '%s\n\n' '**Nightly build** of `main` — untested, and not a release. Take a tagged release for anything real.'
              cat notes.md
            } > notes.tmp && mv notes.tmp notes.md
          else
            # A tagged release leads with the Brown overview, then the install
            # notes. Below those goes the curated entry for this tag from
            # CHANGELOG.md, if one exists; GitHub's raw commit list
            # (`--generate-notes`) is the fallback for a tag the changelog has
            # not been given an entry for.
            cat brown.md notes.md > notes.tmp && mv notes.tmp notes.md
            tag="${GITHUB_REF_NAME#v}"
            entry=$(awk -v want="## [${tag}]" '
              index($0, want) == 1 { grab = 1; next }
              grab && /^## \[/ { grab = 0 }
              grab { print }
            ' CHANGELOG.md)
            if [ -n "$entry" ]; then
              {
                printf '\n## What changed in %s\n\n' "$GITHUB_REF_NAME"
                printf '%s\n' "$entry"
              } >> notes.md
            else
              extra+=(--generate-notes)
            fi
          fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # **The release page is an elevator ride.** The notes sit above the
            # download assets, so a wall of prose buries the thing a visitor
            # came for. This has been asked for more than once and a prose rule
            # in a document has not held, so it is a check: notes past the limit
            # fail the release here rather than shipping.
            NOTES_MAX_LINES=60
            notes_lines=$(wc -l < notes.md)
            if [ "$notes_lines" -gt "$NOTES_MAX_LINES" ]; then
              echo "::error::the release notes are $notes_lines lines and the limit is $NOTES_MAX_LINES — shorten the preamble in this workflow, or the CHANGELOG entry for $GITHUB_REF_NAME."
              exit 1
            fi
            echo "release notes: $notes_lines lines (limit $NOTES_MAX_LINES)"

            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file notes.md "${extra[@]}"
          elif [ "$nightly" = "1" ]; then
            # A nightly keeps the *same* asset names every night, so the
            # already-present skip below would leave yesterday's binaries in
            # place and silently publish nothing new — the tag moves and the
            # workflow re-runs, but the download never changes. Retitle and
            # delete the old assets, so a nightly really is last night's build.
            # (The title gains today's date but the body is left alone: an edit
            # cannot regenerate notes the way `create` does, and the blurb
            # already there says the same thing.)
            # Versioned tags are untouched: their names carry the version, so a
            # same-named asset there really is the same build and the skip is
            # what makes a resumed upload cheap.
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$title"
            for name in $(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json assets -q '.assets[].name'); do
              echo "replacing stale nightly asset: $name"
              gh release delete-asset "$GITHUB_REF_NAME" "$name" \
                --repo "$GITHUB_REPOSITORY" --yes || true
            done
          fi
          # One asset at a time, with its own retries, rather than one
          # `gh release upload dist/*`: the uploads endpoint returns HTTP 500
          # often enough on a ~150 MB asset that a whole release could abort
          # with everything already uploaded intact and only the *next* file
          # lost (seen on v1.6.13_CB: ten assets in, "Error saving asset" on the
          # eleventh). Files already on the release are skipped, so a re-run
          # after such a failure carries only what did not make it instead of
          # re-uploading gigabytes.
          existing=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[].name')
          failed=""
          for f in dist/*; do
            name=$(basename "$f")
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              echo "already uploaded: $name"
              continue
            fi
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "$f"; then
                ok=1
                break
              fi
              echo "::warning::$name failed to upload (attempt $attempt) — retrying"
              sleep $((attempt * 20))
            done
            if [ "$ok" -ne 1 ]; then
              failed="$failed $name"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::assets still missing after retries:$failed"
            exit 1
          fi
