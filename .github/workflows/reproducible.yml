name: Reproducibility

# Builds the linux-x86_64-compat binary, and the web client it embeds, twice
# from the same commit and fails unless the two come out byte for byte the
# same. The two builds differ in everything a user's rebuild would: the
# directory the source is checked out to, the time zone and the locale, and
# (for the web client) the machine. When they do not match, diffoscope's report
# of where they differ is on the run page.
#
# Only the -compat build is checked because only it has a pinned environment —
# a fixed image and a fixed compiler. The regular Linux builds run on whatever
# `ubuntu-latest` is that week, and Windows and macOS on rolling toolchains.
on:
  workflow_dispatch:
  # Weekly, Sunday 04:41 UTC: often enough to notice a regression within a
  # release or two, rarely enough that four release-sized builds a week do not
  # matter. The odd minute for the reason given in release.yml.
  schedule:
    - cron: '41 4 * * 0'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # The compiler and the image are read out of release.yml rather than written
  # here a second time, so this can never check a pairing the release does not
  # use.
  pins:
    runs-on: ubuntu-latest
    outputs:
      toolchain: ${{ steps.read.outputs.toolchain }}
      image: ${{ steps.read.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: read
        run: |
          toolchain=$(sed -n 's/^  LINUX_RUST_TOOLCHAIN: "\(.*\)"$/\1/p' .github/workflows/release.yml)
          image=$(grep -o 'ubuntu:22.04@sha256:[0-9a-f]*' .github/workflows/release.yml | sort -u)
          if [[ -z "$toolchain" || -z "$image" || "$image" == *$'\n'* ]]; then
            echo "::error::could not read one pinned toolchain and one pinned image from release.yml"
            exit 1
          fi
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "toolchain $toolchain, image $image"

  # As release.yml's `web` job, once per attempt.
  web:
    name: web client (${{ matrix.attempt }})
    needs: pins
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { attempt: first,  dir: sdroxide,          tz: UTC,                lang: C.UTF-8 }
          - { attempt: second, dir: elsewhere/rebuild, tz: Pacific/Kiritimati, lang: C }
    env:
      TZ: ${{ matrix.tz }}
      LC_ALL: ${{ matrix.lang }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ matrix.dir }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.pins.outputs.toolchain }}
          targets: wasm32-unknown-unknown
      - run: packaging/linux/reproducible-env.sh >> "$GITHUB_ENV"
      # Keep in step with release.yml.
      - name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xzf - -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build web client
        working-directory: ${{ matrix.dir }}/crates/sdroxide-web
        run: trunk build --release
      - uses: actions/upload-artifact@v7
        with:
          name: web-${{ matrix.attempt }}
          path: ${{ matrix.dir }}/crates/sdroxide-web/dist
          if-no-files-found: error
          retention-days: 7

  # As release.yml's `build` job for linux-x86_64-compat (cat), up to the
  # stripped binary. No rust-cache: each attempt has to build everything itself,
  # or the check would compare one build's dependencies with themselves.
  native:
    name: linux-x86_64-compat (${{ matrix.attempt }})
    needs: [pins, web]
    runs-on: ubuntu-latest
    container: ${{ needs.pins.outputs.image }}
    strategy:
      matrix:
        include:
          - { attempt: first,  dir: sdroxide,          tz: UTC,                lang: C.UTF-8 }
          - { attempt: second, dir: elsewhere/rebuild, tz: Pacific/Kiritimati, lang: C }
    env:
      TZ: ${{ matrix.tz }}
      LC_ALL: ${{ matrix.lang }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.dir }}
    steps:
      # Before checkout, for the reason given in release.yml — and from the
      # workspace root, since the checkout directory does not exist yet.
      - name: Install git
        working-directory: .
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ matrix.dir }}
      - run: packaging/linux/install-compat-deps.sh cat
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.pins.outputs.toolchain }}
      - run: packaging/linux/reproducible-env.sh >> "$GITHUB_ENV"
      # Each attempt embeds its own web build, so a web client that does not
      # reproduce shows up here as well as in the comparison of the two dists.
      - uses: actions/download-artifact@v8
        with:
          name: web-${{ matrix.attempt }}
          path: ${{ matrix.dir }}/crates/sdroxide-web/dist
      - name: Build
        run: |
          cargo build --release --locked -p sdroxide --no-default-features --features embed-web,rtl433
          strip target/release/sdroxide
          sha256sum target/release/sdroxide
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.attempt }}
          path: ${{ matrix.dir }}/target/release/sdroxide
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: [web, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: builds
      - name: Compare
        id: compare
        run: |
          cd builds
          status=0
          for what in web native; do
            echo "## $what"
            (cd "$what-first" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$what-first.sums"
            (cd "$what-second" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$what-second.sums"
            if diff -u "$what-first.sums" "$what-second.sums"; then
              echo "identical:"
              cat "$what-first.sums"
            else
              echo "::error::the two $what builds differ"
              status=1
            fi
          done
          exit $status
      - name: Explain the difference
        if: failure() && steps.compare.outcome == 'failure'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends diffoscope-minimal binutils
          cd builds
          for what in web native; do
            # Exits non-zero precisely because there are differences.
            diffoscope --html "../diffoscope-$what.html" --text "../diffoscope-$what.txt" \
              "$what-first" "$what-second" || true
            head -n 400 "../diffoscope-$what.txt"
          done
      - uses: actions/upload-artifact@v7
        if: failure() && steps.compare.outcome == 'failure'
        with:
          name: diffoscope
          path: diffoscope-*
