<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>sdroxide web output-device harness</title>
<script>
    // The page's own bookkeeping, done before the bridge loads: a wrapper
    // around AudioContext, so the harness can see every context the bridge
    // builds, and a wrapper around setSinkId, so it can see whether the default
    // output was ever asked for. Asking only the bridge about itself would be
    // asking the thing under test.
    window.__contexts = [];
    window.__sinkCalls = [];
    window.__sinkSupported = false;
    (function () {
        // Nothing is silent: if the bridge or the harness throws while the
        // page is loading, that is the answer to the question, and it has to
        // reach the runner.
        function report(line) {
            try {
                fetch("/result?line=" + encodeURIComponent(line));
            } catch (e) {}
        }
        window.addEventListener("error", (e) =>
            report("FAIL script error: " + (e.message || e.error))
        );
        window.addEventListener("unhandledrejection", (e) =>
            report("FAIL script rejection: " + (e.reason && e.reason.message ? e.reason.message : e.reason))
        );
        window.__report = report;

        const Real = window.AudioContext || window.webkitAudioContext;
        function Observed(...args) {
            const c = new Real(...args);
            window.__contexts.push(c);
            return c;
        }
        Observed.prototype = Real.prototype;
        window.AudioContext = Observed;

        // `setSinkId` is what lets a page choose its output. The fix asks for
        // the default ("") on every context it builds, and this records the
        // request without changing whether it succeeds -- headless Chromium may
        // or may not have an output to select, so what is asserted is that the
        // page asked, not that the browser agreed.
        const proto = Real.prototype;
        if (typeof proto.setSinkId === "function") {
            const real = proto.setSinkId;
            proto.setSinkId = function (id) {
                window.__sinkCalls.push({ id: id });
                try {
                    return real.call(this, id);
                } catch (e) {
                    return Promise.reject(e);
                }
            };
            // A prototype whose method cannot be replaced would report calls
            // that never happened; only claim support when the wrapper took.
            window.__sinkSupported = proto.setSinkId !== real;
        }

        // Did the bridge ever ask to be told about device changes? A listener
        // the page never registered cannot fire, and that is a different
        // failure from one that fired and did not rebuild.
        window.__mdAdds = [];
        window.__mdPresents = !!(navigator.mediaDevices && navigator.mediaDevices.addEventListener);
        try {
            const md = navigator.mediaDevices;
            const add = md.addEventListener.bind(md);
            md.addEventListener = function (type, fn, opts) {
                window.__mdAdds.push(type);
                return add(type, fn, opts);
            };
        } catch (e) {}

        // No Sound welcome layer over the page: it swallows the first gesture
        // by design, and this harness needs the bridge's ordinary path.
        try {
            localStorage.setItem("sdroxide-sound-welcome", "0");
        } catch (e) {}
        report("note page loading " + location.href);
    })();
</script>
<script src="audio_bridge.js"></script>
<script src="harness.js"></script>
</head>
<body></body>
</html>
